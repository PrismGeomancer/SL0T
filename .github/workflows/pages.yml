name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @sl0t/app...
      - run: pnpm -C app test
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional build-time overrides of app/src/config.ts (repo Settings > Secrets / Variables).
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_PROGRAM_ID: ${{ vars.PROGRAM_ID }}
          VITE_CLUSTER: ${{ vars.CLUSTER }}
          VITE_KEEPER_ADDRESS: ${{ vars.KEEPER_ADDRESS }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm -C app build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
