[package]
name = "mock-pump"
version = "0.1.0"
description = "Test-only stand-in for pump.fun: same account layouts and create_v2 discriminator. Never deploy."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_pump"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
