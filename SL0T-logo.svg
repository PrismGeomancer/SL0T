<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>SL0T</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1622"/>
      <stop offset="0.5" stop-color="#2a2131"/>
      <stop offset="1" stop-color="#1c1622"/>
    </linearGradient>
  </defs>
  <!-- coin body -->
  <circle cx="256" cy="256" r="248" fill="#07060A"/>
  <!-- neon ring -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FF2E4D" stroke-width="34" filter="url(#glow)"/>
  <!-- marquee bulbs -->
  <g fill="#FFC24B" filter="url(#glow)"><circle cx="256" cy="50" r="12"/><circle cx="359" cy="78" r="12"/><circle cx="434" cy="153" r="12"/><circle cx="462" cy="256" r="12"/><circle cx="434" cy="359" r="12"/><circle cx="359" cy="434" r="12"/><circle cx="256" cy="462" r="12"/><circle cx="153" cy="434" r="12"/><circle cx="78" cy="359" r="12"/><circle cx="50" cy="256" r="12"/><circle cx="78" cy="153" r="12"/><circle cx="153" cy="78" r="12"/></g>
  <!-- reel window -->
  <rect x="146" y="118" width="220" height="276" rx="34" fill="url(#win)" stroke="#FFC24B" stroke-width="16"/>
  <!-- slashed zero -->
  <g filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="64" ry="92" fill="none" stroke="#FFC24B" stroke-width="34"/>
    <line x1="210" y1="320" x2="302" y2="192" stroke="#FFC24B" stroke-width="28" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
